name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          swiftformat --version

      - name: Check formatting
        run: swiftformat --lint .

      - name: Build the package
        working-directory: ShitsuraeCore
        run: swift build

      - name: Tests
        working-directory: ShitsuraeCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Build the app
        run: |
          xcodebuild -project Shitsurae.xcodeproj \
            -scheme Shitsurae \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
